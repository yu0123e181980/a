<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプルルーレット</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-bottom: 30px;
            color: #333;
            font-size: 2em;
        }

        .roulette-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto 30px;
        }

        .arrow {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid #ff4757;
            z-index: 10;
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.3));
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 10px solid #333;
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .wheel.spinning {
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        .section {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .section span {
            position: absolute;
            top: 40%;
            right: 20%;
            transform: rotate(-22.5deg);
            font-weight: bold;
            font-size: 20px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .section:nth-child(1) {
            background: #ff6b6b;
            transform: rotate(0deg) skewY(-45deg);
        }

        .section:nth-child(2) {
            background: #4ecdc4;
            transform: rotate(45deg) skewY(-45deg);
        }

        .section:nth-child(3) {
            background: #ffe66d;
            transform: rotate(90deg) skewY(-45deg);
        }

        .section:nth-child(4) {
            background: #95e1d3;
            transform: rotate(135deg) skewY(-45deg);
        }

        .section:nth-child(5) {
            background: #f38181;
            transform: rotate(180deg) skewY(-45deg);
        }

        .section:nth-child(6) {
            background: #aa96da;
            transform: rotate(225deg) skewY(-45deg);
        }

        .section:nth-child(7) {
            background: #fcbad3;
            transform: rotate(270deg) skewY(-45deg);
        }

        .section:nth-child(8) {
            background: #a8e6cf;
            transform: rotate(315deg) skewY(-45deg);
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            border: 5px solid #333;
            z-index: 5;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            min-height: 30px;
        }

        .result.show {
            animation: resultPop 0.5s ease;
        }

        @keyframes resultPop {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 ルーレット 🎰</h1>

        <div class="roulette-container">
            <div class="arrow"></div>
            <div class="wheel" id="wheel">
                <div class="section"><span>1</span></div>
                <div class="section"><span>2</span></div>
                <div class="section"><span>3</span></div>
                <div class="section"><span>4</span></div>
                <div class="section"><span>5</span></div>
                <div class="section"><span>6</span></div>
                <div class="section"><span>7</span></div>
                <div class="section"><span>8</span></div>
                <div class="center-circle"></div>
            </div>
        </div>

        <button id="spinButton" onclick="spin()">回す！</button>

        <div class="result" id="result"></div>
    </div>

    <script>
        const wheel = document.getElementById('wheel');
        const spinButton = document.getElementById('spinButton');
        const resultDiv = document.getElementById('result');
        let isSpinning = false;
        let currentRotation = 0;

        function spin() {
            if (isSpinning) return;

            isSpinning = true;
            spinButton.disabled = true;
            resultDiv.textContent = '';
            resultDiv.classList.remove('show');

            // ランダムな回転角度を生成（最低5回転 + ランダム）
            const minRotation = 1800; // 5回転
            const randomRotation = Math.floor(Math.random() * 360);
            const totalRotation = minRotation + randomRotation;

            currentRotation += totalRotation;

            wheel.style.transform = `rotate(${currentRotation}deg)`;
            wheel.classList.add('spinning');

            // 回転終了後の処理
            setTimeout(() => {
                // どのセクションで止まったかを計算
                const normalizedRotation = currentRotation % 360;
                const sectionAngle = 360 / 8; // 8セクション

                // 矢印は上（0度）を指しているので、回転を考慮して当選セクションを計算
                let winningSection = Math.floor((360 - normalizedRotation + sectionAngle / 2) / sectionAngle) % 8 + 1;

                resultDiv.textContent = `🎉 結果: ${winningSection} 🎉`;
                resultDiv.classList.add('show');

                isSpinning = false;
                spinButton.disabled = false;
                wheel.classList.remove('spinning');
            }, 4000);
        }
    </script>
</body>
</html>
